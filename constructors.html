<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Constructor Standings | F1 Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="index.html">DASHBOARD</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="standings.html">Standings</a>
      <a href="results.html">Results</a>
      <a class="active" href="constructors.html">Constructors</a>
      <a href="schedule.html">Schedule</a>
      <a href="compare.html">Compare</a>
    </nav>
  </header>

  <main>
    <section class="hero hero--section">
      <div class="hero-copy">
        <div>
          <p class="eyebrow">Constructors</p>
          <h1 class="hero-title">Constructor Standings</h1>
        </div>
        <p class="hero-meta">Official constructor ranking pulled live from the API.</p>
      </div>
      <div class="hero-actions">
        <button id="refresh-constructors" class="refresh-btn refresh-btn--minimal" type="button">
          <svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35a7.95 7.95 0 0 0-11.3 0 8 8 0 0 0 0 11.3 8 8 0 0 0 11.3 0l1.45 1.45v-5h-5l1.45 1.45a6 6 0 0 1-8.48 0 6 6 0 0 1 0-8.48 6 6 0 0 1 8.48 0l.77.78 1.42-1.42-.77-.78z" fill="currentColor"/></svg>
          <span>Refresh</span>
        </button>
      </div>
    </section>

    <section class="standings-section">
      <div class="card">
        <div id="constructors-loading" class="loading-state">Loading constructor standings…</div>
        <div id="constructors-error" class="error-state hidden"></div>
        <div id="constructors-list"></div>
      </div>
    </section>
  </main>

  <script src="api.js"></script>
  <script>
    async function loadConstructors() {
      const loading = document.getElementById('constructors-loading');
      const error = document.getElementById('constructors-error');
      const list = document.getElementById('constructors-list');

      try {
        const standings = await getConstructorStandings();
        console.log('Constructor standings response:', standings);
        list.innerHTML = '';

        standings.forEach((entry) => {
          const card = document.createElement('div');
          card.classList.add('constructor-item');

          const teamName = entry.Constructor.name;
          const teamColor = getTeamColor(teamName);
          card.style.borderLeft = `4px solid ${teamColor}`;

          card.innerHTML = `
            <span class="position">${entry.position}</span>
            <div class="constructor-info">
              <span class="constructor-name">${teamName}</span>
              <span class="team-name">${entry.Constructor.nationality} · ${entry.wins} win${entry.wins !== '1' ? 's' : ''}</span>
            </div>
            <span class="points">${entry.points} PTS</span>
          `;

          const posEl = card.querySelector('.position');
          if (posEl) {
            posEl.style.background = `${teamColor}22`;
            posEl.style.color = teamColor;
          }

          list.appendChild(card);
        });

        loading.classList.add('hidden');
        error.classList.add('hidden');

      } catch (error) {
        list.innerHTML = '';
        loading.classList.add('hidden');
        error.textContent = 'Failed to load constructor standings. Please try again.';
        error.classList.remove('hidden');
        console.error(error);
      }
    }

    loadConstructors();
    document.getElementById('refresh-constructors').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
